        .kpi-card {

            margin-top: 2px;
        }

            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 22px;
            margin-bottom: 24px;
        }

            background: white;
            border-radius: 24px;

            z-index: 2;

            // ------------------------------------------------------------
            // 2. دوال معالجة البيانات

            function getCountryTotals(data, countries) {
                const totals = {};
                countries.forEach(c => { totals[c] = { messages: 0, spent: 0, newMuslims: 0 }; });

                data.forEach(day => {
                    countries.forEach(c => {
                        const vals = day[c];
                        if (vals) {
                            totals[c].messages += vals[0] || 0;
                            totals[c].spent += vals[1] || 0;
                            totals[c].newMuslims += vals[2] || 0;
                        }
                    });
                });
                return totals;
            }

            function enrichTotals(totals) {
                const enriched = {};
                Object.keys(totals).forEach(c => {
                    const t = totals[c];
                    const costPerMuslim = t.newMuslims > 0 ? t.spent / t.newMuslims : 0;
                    const cr = t.messages > 0 ? (t.newMuslims / t.messages) * 100 : 0;
                    enriched[c] = { ...t, costPerMuslim, cr };
                });
                return enriched;
            }

            function getDailyNewMuslims(data, countries, filterCountry = 'all') {
                return data.map(day => {
                    let total = 0;
                    if (filterCountry === 'all') {
                        countries.forEach(c => { total += (day[c] ? day[c][2] : 0); });
                    } else {
                        total = day[filterCountry] ? day[filterCountry][2] : 0;
                    }
                    return { date: day.date, newMuslims: total };
                });
            }

            function getOverallStats(totals) {
                let totalMessages = 0,
                    totalSpent = 0,
                    totalNew = 0;
                Object.values(totals).forEach(t => {
                    totalMessages += t.messages;
                    totalSpent += t.spent;
                    totalNew += t.newMuslims;
                });
                const overallCR = totalMessages > 0 ? (totalNew / totalMessages) * 100 : 0;
                const avgCost = totalNew > 0 ? totalSpent / totalNew : 0;
                return { totalMessages, totalSpent, totalNew, overallCR, avgCost };
            }

            function renderKPIs(stats) {
                document.getElementById('kpiGrid').innerHTML = `
                    <div class="kpi-card"><div class="kpi-label"><i class="fas fa-envelope"></i> إجمالي الرسائل</div><div class="kpi-value">${stats.totalMessages.toLocaleString()}</div><div class="kpi-sub">جميع الدول</div></div>
                    <div class="kpi-card"><div class="kpi-label"><i class="fas fa-money-bill-wave"></i> إجمالي المصروفات</div><div class="kpi-value"><span class="egp-symbol">E£</span>${Math.round(stats.totalSpent).toLocaleString()}</div><div class="kpi-sub">جنيه مصري</div></div>
                    <div class="kpi-card"><div class="kpi-label"><i class="fas fa-user-plus"></i> إجمالي الجدد</div><div class="kpi-value">${stats.totalNew.toLocaleString()}</div><div class="kpi-sub">${(stats.totalNew/31).toFixed(1)} / يوم</div></div>
                    <div class="kpi-card"><div class="kpi-label"><i class="fas fa-coins"></i> متوسط التكلفة/مسلم</div><div class="kpi-value"><span class="egp-symbol">E£</span>${stats.avgCost.toFixed(2)}</div><div class="kpi-sub">إجمالي</div></div>
                    <div class="kpi-card"><div class="kpi-label"><i class="fas fa-percent"></i> نسبة التحويل</div><div class="kpi-value">${stats.overallCR.toFixed(2)}%</div><div class="kpi-sub">جدد / رسائل</div></div>
                `;
            }

            function renderTable(enriched, filterCountry = 'all') {
                let data = Object.keys(enriched).map(c => ({ country: c, ...enriched[c] }));
                if (filterCountry !== 'all') {
                    data = data.filter(d => d.country === filterCountry);
                }
                // Sort
                data.sort((a, b) => {
                    let va = a[currentSortKey],
                        vb = b[currentSortKey];
                    if (typeof va === 'string') va = va.toLowerCase();
                    if (typeof vb === 'string') vb = vb.toLowerCase();
                    if (va < vb) return currentSortDir === 'asc' ? -1 : 1;
                    if (va > vb) return currentSortDir === 'asc' ? 1 : -1;
                    return 0;
                });

                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.map(d => `
                    <tr>
                        <td><span class="badge-flag">${d.country.slice(0,3)}</span> ${d.country}</td>
                        <td style="text-align:left;">${d.messages.toLocaleString()}</td>
                        <td style="text-align:left; color:#1a4a6a;">E£${Math.round(d.spent).toLocaleString()}</td>
                        <td style="text-align:left; font-weight:600;">${d.newMuslims}</td>
                        <td style="text-align:left; font-weight:500; color:#1a6b3a;">E£${d.costPerMuslim.toFixed(2)}</td>
                        <td style="text-align:left;">${d.cr.toFixed(1)}%</td>
                    </tr>
                `).join('');

                // Update sort icons
                document.querySelectorAll('#dataTable thead th i').forEach(icon => icon.className = 'fas fa-sort');
                const th = document.querySelector(`#dataTable thead th[data-sort="${currentSortKey}"]`);
                if (th) {
                    const icon = th.querySelector('i');
                    icon.className = currentSortDir === 'asc' ? 'fas fa-arrow-up' : 'fas fa-arrow-down';
                }
            }

            function renderCharts(filterCountry = 'all') {
                const ctxTrend = document.getElementById('trendChart').getContext('2d');
                const dailyData = getDailyNewMuslims(rawData, countries, filterCountry);
                const labels = dailyData.map(d => d.date.slice(5));
                const values = dailyData.map(d => d.newMuslims);

                if (trendChart) trendChart.destroy();
                trendChart = new Chart(ctxTrend, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: 'المسلمين الجدد', data: values, borderColor: '#1f6eb0',
                            backgroundColor: 'rgba(31,110,176,0.1)', tension: 0.2, fill: true, pointRadius: 2 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: '#e8eff7' } }, x: { grid: { display: false } } }
                    }
                });

                // New Muslims Bar Chart
                const ctxBar = document.getElementById('newMuslimsBarChart').getContext('2d');
                let barData = Object.keys(enrichedTotals).map(c => ({ country: c, newMuslims: enrichedTotals[c]
                        .newMuslims }));
                if (filterCountry !== 'all') {
                    barData = barData.filter(d => d.country === filterCountry);
                }
                barData.sort((a, b) => b.newMuslims - a.newMuslims);

                if (newMuslimsBarChart) newMuslimsBarChart.destroy();
                newMuslimsBarChart = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: barData.map(d => d.country.slice(0, 5)),
                        datasets: [{ label: 'إجمالي الجدد', data: barData.map(d => d.newMuslims),
                            backgroundColor: '#e68a3a', borderRadius: 5 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: '#e8eff7' } }, x: { grid: { display: false } } }
                    }
                });

                // Cost Per Muslim Bar Chart
                const ctxCost = document.getElementById('costBarChart').getContext('2d');
                let costData = Object.keys(enrichedTotals).map(c => ({ country: c, cost: enrichedTotals[c]
                        .costPerMuslim }));
                if (filterCountry !== 'all') {
                    costData = costData.filter(d => d.country === filterCountry);
                }
                costData.sort((a, b) => b.cost - a.cost);

                if (costBarChart) costBarChart.destroy();
                costBarChart = new Chart(ctxCost, {
                    type: 'bar',
                    data: {
                        labels: costData.map(d => d.country.slice(0, 5)),
                        datasets: [{ label: 'جنيه لكل مسلم', data: costData.map(d => d.cost),
                            backgroundColor: '#2a7a5a', borderRadius: 5 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: (ctx) => 'E£' + ctx.parsed.y.toFixed(2) } }
                        },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#e8eff7' }, ticks: { callback: (v) => 'E£' + v
                                    .toFixed(0) } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            function updateDashboard(filterCountry = 'all') {
                renderKPIs(stats);
                renderTable(enrichedTotals, filterCountry);
                renderCharts(filterCountry);
                document.getElementById('updateTime').textContent = new Date().toLocaleString('ar-EG');
            }

            // ------------------------------------------------------------
            // 5. تهيئة الفلاتر والأحداث
            // ------------------------------------------------------------
            function populateCountryFilter() {
                const select = document.getElementById('countryFilter');
                select.innerHTML = '<option value="all">جميع الدول</option>';
                countries.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                populateCountryFilter();
                updateDashboard('all');

                // Filter change
                document.getElementById('countryFilter').addEventListener('change', function(e) {
                    currentFilter = e.target.value;
                    updateDashboard(currentFilter);
                });

                // Refresh button
                document.getElementById('refreshBtn').addEventListener('click', function() {
                    this.querySelector('i').classList.add('fa-spin');
                    updateDashboard(currentFilter);
                    setTimeout(() => this.querySelector('i').classList.remove('fa-spin'), 500);
                });

                // Table sorting
                document.querySelectorAll('#dataTable thead th').forEach(th => {
                    th.addEventListener('click', function() {
                        const key = this.dataset.sort;
                        if (!key) return;
                        if (currentSortKey === key) {
                            currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                        } else {
                            currentSortKey = key;
                            currentSortDir = 'asc';
                        }
                        renderTable(enrichedTotals, currentFilter);
                    });
                });
            });

        })();
    </script>
</body>
</html>
